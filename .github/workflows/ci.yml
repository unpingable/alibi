name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain (rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Package experimental binary
        run: python3 scripts/package-release.py --binary target/release/alibi --output dist

      - name: Smoke test package
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xzf alibi-0.1.0-x86_64-unknown-linux-gnu.tar.gz
          ./alibi-0.1.0-x86_64-unknown-linux-gnu/alibi --version
          ./alibi-0.1.0-x86_64-unknown-linux-gnu/alibi --help

      - uses: actions/upload-artifact@v4
        with:
          name: alibi-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
