name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain (rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Package experimental binary
        run: python3 scripts/package-release.py --binary target/release/alibi --output dist

      - name: Smoke test package
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xzf alibi-*.tar.gz
          ./alibi-*/alibi --version
          ./alibi-*/alibi --help

      - uses: actions/upload-artifact@v4
        with:
          name: alibi-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  compatible-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test older GNU binary
        run: scripts/build-compatible-linux.sh "$RUNNER_TEMP/alibi-compatible"
      - name: Verify archive
        run: |
          cd "$RUNNER_TEMP/alibi-compatible/dist"
          sha256sum --check SHA256SUMS
          tar -xzf alibi-*.tar.gz
          ./alibi-*/alibi --version
          ./alibi-*/alibi --help
      - name: Exercise exact archive on native glibc 2.31
        run: |
          archive=$(find "$RUNNER_TEMP/alibi-compatible/dist" -name '*.tar.gz' -printf '%f')
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/alibi-compatible,dst=/out" \
            rust:1.94.0-bullseye@sha256:16950191527a4cb9e0762d9d48b705a6315158e4035e64f7a93ce8656a1b053c \
            sh /src/scripts/check-glibc231.sh "/out/dist/$archive" /out/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: alibi-linux-x86_64-glibc2.31-${{ github.sha }}
          path: |
            ${{ runner.temp }}/alibi-compatible/dist/*.tar.gz
            ${{ runner.temp }}/alibi-compatible/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alibi-glibc231-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/alibi-compatible/runtime/*.txt
            ${{ runner.temp }}/alibi-compatible/runtime/*.json
            ${{ runner.temp }}/alibi-compatible/runtime/*.stderr
            ${{ runner.temp }}/alibi-compatible/runtime/*.sha256
          if-no-files-found: warn
          retention-days: 14
